<!DOCTYPE html>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eeeeee;
            color: #222;
        }

        /* HEADER */
        .header {
            background: #444444;
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .header p {
            color: #dddddd;
        }

        /* MAIN LAYOUT */
        .layout {
            display: flex;
            min-height: calc(100vh - 112px);
        }

        /* SIDEBAR */
        .sidebar {
            width: 300px;
            background: #2f2f2f;
            color: white;
            padding: 20px;

            position: sticky;
            top: 0;

            height: calc(100vh - 112px);

            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        .item {
            width: 100%;
            border: none;

            background: #414141;
            color: white;

            text-align: left;

            padding: 13px;
            margin: 5px 0;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;
        }

        .item:hover,
        .item.active {
            background: #707070;
        }

        /* CONTENT */
        .main {
            flex: 1;
            padding: 30px;
        }

        .card {
            background: white;

            max-width: 1150px;

            margin: auto;

            padding: 28px;

            border-radius: 10px;

            box-shadow: 0 3px 12px #0002;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .desc {
            background: #f5f5f5;

            border-left: 5px solid #666;

            padding: 16px;

            margin: 18px 0;

            line-height: 1.7;
        }

        /* BUTTONS */
        .actions {
            margin: 16px 0;

            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            background: #444444;

            color: white;

            border: none;

            border-radius: 6px;

            padding: 10px 15px;

            cursor: pointer;

            text-decoration: none;

            font-size: 14px;
        }

        .btn:hover {
            background: #666666;
        }

        /* JAVA CODE */
        .code {
            background: #1e1e1e;

            color: #eeeeee;

            padding: 18px;

            border-radius: 8px;

            overflow-x: auto;

            line-height: 1.5;

            font-family: Consolas, monospace;

            font-size: 13px;

            white-space: pre;
        }

        /* OUTPUT */
        .output {
            background: #f5f5f5;

            border: 1px solid #cccccc;

            padding: 16px;

            border-radius: 8px;

            white-space: pre-wrap;

            font-family: Consolas, monospace;

            margin-top: 10px;
        }

        /* IMAGE */
        .diagram {
            display: block;

            width: 100%;

            max-width: 1100px;

            max-height: 800px;

            object-fit: contain;

            background: #fafafa;

            border: 1px solid #cccccc;

            border-radius: 8px;

            margin: 15px auto;
        }

        /* IMAGE ERROR */
        .image-error {
            display: none;

            background: #f8d7da;

            color: #842029;

            border: 1px solid #f5c2c7;

            padding: 15px;

            border-radius: 8px;

            margin-top: 10px;

            line-height: 1.6;
        }

        /* NOTE */
        .note {
            padding: 14px;

            background: #fafafa;

            border: 1px solid #dddddd;

            border-radius: 7px;

            line-height: 1.6;
        }

        /* TAG */
        .tag {
            display: inline-block;

            background: #dddddd;

            padding: 5px 9px;

            border-radius: 15px;

            font-size: 12px;

            margin-bottom: 10px;
        }

        /* FOOTER */
        .footer {
            background: #444444;

            color: #dddddd;

            text-align: center;

            padding: 16px;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;

                height: auto;

                position: relative;
            }

            .main {
                padding: 15px;
            }

            .card {
                padding: 18px;
            }

            .header h1 {
                font-size: 22px;
            }

            .diagram {
                max-height: none;
            }
        }
    </style>

import java.util.Scanner;

public class FunctionPointCalculator {

    public static void main(String[] args) {

        Scanner sc = new Scanner(System.in);

        int userInputs = 3;
        int userOutputs = 60;
        int userInquiries = 24;
        int files = 8;
        int externalInterfaces = 2;

        int eiWeight = 4;
        int eoWeight = 5;
        int eqWeight = 4;
        int ilfWeight = 10;
        int eifWeight = 7;

        int ufp =
                (userInputs * eiWeight)
                + (userOutputs * eoWeight)
                + (userInquiries * eqWeight)
                + (files * ilfWeight)
                + (externalInterfaces * eifWeight);

        int totalAdjustment = 14 * 3;

        double vaf =
                0.65 + (0.01 * totalAdjustment);

        double functionPoints =
                ufp * vaf;

        System.out.println("UFP = " + ufp);

        System.out.printf(
            "VAF = %.2f%n",
            vaf
        );

        System.out.printf(
            "Function Point = %.2f%n",
            functionPoints
        );

        sc.close();
    }
}
`;

import java.util.Scanner;

public class CocomoIIObjectPointCalculator {

    public static void main(String[] args) {

        Scanner sc = new Scanner(System.in);

        int screens = 12;
        int reports = 10;
        int components = 80;

        int screenWeight = 2;
        int reportWeight = 5;
        int componentWeight = 10;

        int objectPoints =
                (screens * screenWeight)
                + (reports * reportWeight)
                + (components * componentWeight);

        double reusePercentage = 0;

        double newObjectPoints =
                objectPoints *
                (100 - reusePercentage) / 100;

        double productivity = 13;

        double effort =
                newObjectPoints / productivity;

        System.out.println(
            "Total Object Points = "
            + objectPoints
        );

        System.out.println(
            "New Object Points = "
            + newObjectPoints
        );

        System.out.printf(
            "Estimated Effort = %.2f person-months%n",
            effort
        );

        sc.close();
    }
}
`;

import java.util.Scanner;

public class CyclomaticComplexityCalculator {

    public static void main(String[] args) {

        Scanner sc = new Scanner(System.in);

        System.out.println(
            "1. Using Decision Nodes"
        );

        System.out.println(
            "2. Using Edges and Nodes"
        );

        System.out.print(
            "Enter choice: "
        );

        int choice = sc.nextInt();


        if (choice == 1) {

            System.out.print(
                "Enter number of decision nodes: "
            );

            int decisions = sc.nextInt();

            int complexity =
                    decisions + 1;

            System.out.println(
                "V(G) = D + 1"
            );

            System.out.println(
                "Cyclomatic Complexity = "
                + complexity
            );

        }

        else if (choice == 2) {

            System.out.print(
                "Enter edges (E): "
            );

            int edges = sc.nextInt();

            System.out.print(
                "Enter nodes (N): "
            );

            int nodes = sc.nextInt();

            int complexity =
                    edges - nodes + 2;

            System.out.println(
                "V(G) = E - N + 2"
            );

            System.out.println(
                "Cyclomatic Complexity = "
                + complexity
            );

        }

        else {

            System.out.println(
                "Invalid choice"
            );

        }

        sc.close();
    }
}
`;

        /* =========================
           ESCAPE HTML
           ========================= */

        function escapeHTML(text) {

            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

        }


        /* =========================
           IMAGE SECTION
           ========================= */

        function createImageSection(
            fileName,
            imageName
        ) {

            return `

                <div class="note">

                    <b>${imageName}</b>

                    <br><br>

                    The diagram for this
                    program is displayed below.

                    <br>

                    You can open the image,
                    download it, or copy it.

                </div>


                <div class="actions">

                    <button
                        class="btn"
                        onclick="copyImage('${fileName}')"
                    >
                        Copy Image
                    </button>


                    <a
                        class="btn"
                        href="${fileName}"
                        download
                    >
                        Download Image
                    </a>


                    <a
                        class="btn"
                        href="${fileName}"
                        target="_blank"
                    >
                        Open Full Image
                    </a>

                </div>


                <img
                    class="diagram"
                    src="${fileName}"
                    alt="${imageName}"
                    onerror="imageError(this)"
                >


                <div
                    class="image-error"
                    id="imageError-${fileName.replace(/[^a-zA-Z0-9]/g, '')}"
                >

                    ❌ <b>Image could not be loaded.</b>

                    <br><br>

                    Make sure the file

                    <b>${fileName}</b>

                    exists in the same GitHub
                    folder as <b>se.html</b>.

                </div>

            `;

        /* =========================
           IMAGE ERROR
           ========================= */

        function imageError(img) {

            img.style.display = "none";

            const errorBox =
                img.nextElementSibling;

            if (errorBox) {

                errorBox.style.display = "block";

            }

        }


        /* =========================
           SHOW PROGRAM
           ========================= */

        function showProgram(
            number,
            button
        ) {

            document
                .querySelectorAll(".item")
                .forEach(function(item) {

                    item.classList.remove("active");

                });


            if (button) {

                button.classList.add("active");

            }


            const program =
                programs[number];


            document.getElementById(
                "content"
            ).innerHTML = `

                <div class="card">

                    <span class="tag">
                        PROGRAM ${number}
                    </span>

                    <h2>
                        ${program.title}
                    </h2>

                    ${program.body}

                </div>

            `;


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }


        /* =========================
           COPY JAVA CODE
           ========================= */

        function copyCode(code) {

            navigator
                .clipboard
                .writeText(code)
                .then(function() {

                    alert(
                        "Java code copied successfully!"
                    );

                })
                .catch(function() {

                    alert(
                        "Unable to copy code."
                    );

                });

        }


        /* =========================
           COPY IMAGE
           ========================= */

        async function copyImage(
            fileName
        ) {

            try {

                const response =
                    await fetch(fileName);


                if (!response.ok) {

                    throw new Error(
                        "Image not found"
                    );

                }


                const blob =
                    await response.blob();


                const imageBlob =
                    new Blob(
                        [blob],
                        {
                            type: blob.type
                        }
                    );


                await navigator.clipboard.write([

                    new ClipboardItem({

                        [blob.type]:
                            imageBlob

                    })

                ]);


                alert(
                    "Image copied successfully! You can paste it into Word."
                );

            }

            catch (error) {

                alert(
                    "Image copy is not available. Please use Download Image."
                );

            }

        }
