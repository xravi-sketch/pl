    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eeeeee;
            color: #222;
        }

        /* HEADER */
        .header {
            background: #444444;
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .header p {
            color: #dddddd;
        }

        /* MAIN LAYOUT */
        .layout {
            display: flex;
            min-height: calc(100vh - 112px);
        }

        /* SIDEBAR */
        .sidebar {
            width: 300px;
            background: #2f2f2f;
            color: white;
            padding: 20px;

            position: sticky;
            top: 0;

            height: calc(100vh - 112px);

            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        .item {
            width: 100%;
            border: none;

            background: #414141;
            color: white;

            text-align: left;

            padding: 13px;
            margin: 5px 0;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;
        }

        .item:hover,
        .item.active {
            background: #707070;
        }

        /* CONTENT */
        .main {
            flex: 1;
            padding: 30px;
        }

        .card {
            background: white;

            max-width: 1150px;

            margin: auto;

            padding: 28px;

            border-radius: 10px;

            box-shadow: 0 3px 12px #0002;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .desc {
            background: #f5f5f5;

            border-left: 5px solid #666;

            padding: 16px;

            margin: 18px 0;

            line-height: 1.7;
        }

        /* BUTTONS */
        .actions {
            margin: 16px 0;

            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            background: #444444;

            color: white;

            border: none;

            border-radius: 6px;

            padding: 10px 15px;

            cursor: pointer;

            text-decoration: none;

            font-size: 14px;
        }

        .btn:hover {
            background: #666666;
        }

        /* JAVA CODE */
        .code {
            background: #1e1e1e;

            color: #eeeeee;

            padding: 18px;

            border-radius: 8px;

            overflow-x: auto;

            line-height: 1.5;

            font-family: Consolas, monospace;

            font-size: 13px;

            white-space: pre;
        }

        /* OUTPUT */
        .output {
            background: #f5f5f5;

            border: 1px solid #cccccc;

            padding: 16px;

            border-radius: 8px;

            white-space: pre-wrap;

            font-family: Consolas, monospace;

            margin-top: 10px;
        }

        /* IMAGE */
        .diagram {
            display: block;

            width: 100%;

            max-width: 1100px;

            max-height: 800px;

            object-fit: contain;

            background: #fafafa;

            border: 1px solid #cccccc;

            border-radius: 8px;

            margin: 15px auto;
        }

        /* IMAGE ERROR */
        .image-error {
            display: none;

            background: #f8d7da;

            color: #842029;

            border: 1px solid #f5c2c7;

            padding: 15px;

            border-radius: 8px;

            margin-top: 10px;

            line-height: 1.6;
        }

        /* NOTE */
        .note {
            padding: 14px;

            background: #fafafa;

            border: 1px solid #dddddd;

            border-radius: 7px;

            line-height: 1.6;
        }

        /* TAG */
        .tag {
            display: inline-block;

            background: #dddddd;

            padding: 5px 9px;

            border-radius: 15px;

            font-size: 12px;

            margin-bottom: 10px;
        }

        /* FOOTER */
        .footer {
            background: #444444;

            color: #dddddd;

            text-align: center;

            padding: 16px;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;

                height: auto;

                position: relative;
            }

            .main {
                padding: 15px;
            }

            .card {
                padding: 18px;
            }

            .header h1 {
                font-size: 22px;
            }

            .diagram {
                max-height: none;
            }
        }
    </style>

</head>

public class FunctionPointCalculator {

    public static void main(String[] args) {
        // Given counts
        int userInputs = 32;
        int userOutputs = 60;
        int userInquiries = 24;
        int files = 8;
        int externalInterfaces = 2;
        // Average complexity weights
        int weightInputs = 4;
        int weightOutputs = 5;
        int weightInquiries = 4;
        int weightFiles = 10;
        int weightExternalInterfaces = 7;

        // Calculate Unadjusted Function Points (UFP)
        int ufp = (userInputs * weightInputs)
                + (userOutputs * weightOutputs) + (userInquiries * weightInquiries)
                + (files * weightFiles)  + (externalInterfaces * weightExternalInterfaces);

        // Complexity Adjustment Factor (CAF) for average complexity
        double caf = 1.0; // since average values assumed

        // Final Function Point value
        double fp = ufp * caf;

        // Display results
        System.out.println("Unadjusted Function Points (UFP): " + ufp);
        System.out.println("Complexity Adjustment Factor (CAF): " + caf);
        System.out.println("Final Function Point Value: " + fp);
    }
}


Function point raa
`;

import java.util.Scanner;
public class CocomoII {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        // Step 1: Input project size
        System.out.print("Enter project size in KLOC: ");
        double size = sc.nextDouble();

        // Step 2: Input scale factors
        System.out.println("Enter ratings for Scale Factors (0=Extra High, 5=Very Low):");
        System.out.print("PREC: "); int PREC = sc.nextInt();
        System.out.print("FLEX: "); int FLEX = sc.nextInt();
        System.out.print("RESL: "); int RESL = sc.nextInt();
        System.out.print("TEAM: "); int TEAM = sc.nextInt();
        System.out.print("PMAT: "); int PMAT = sc.nextInt();

        int sumSF = PREC + FLEX + RESL + TEAM + PMAT;
        double B = 0.91 + 0.01 * sumSF;

        // Step 3: Input cost drivers
        System.out.println("Enter cost driver multipliers:");
        System.out.print("RELY: "); double RELY = sc.nextDouble();
        System.out.print("DATA: "); double DATA = sc.nextDouble();
        System.out.print("CPLX: "); double CPLX = sc.nextDouble();
        System.out.print("TIME: "); double TIME = sc.nextDouble();
        System.out.print("STOR: "); double STOR = sc.nextDouble();
        System.out.print("ACAP: "); double ACAP = sc.nextDouble();
        System.out.print("PCAP: "); double PCAP = sc.nextDouble();
        System.out.print("TOOL: "); double TOOL = sc.nextDouble();
       double costDrivers = RELY * DATA * CPLX * TIME * STOR * ACAP * PCAP * TOOL;

        // Step 4: Effort calculation
        double A = 2.94; // constant
        double effort = A * Math.pow(size, B) * costDrivers;


        // Step 5: Approximate schedule
        double monthsWith4Devs = effort / 4.0;
        double monthsWith6Devs = effort / 6.0;

        // Output results
        System.out.println("\n--- COCOMO II Results ---");
        System.out.println("Scale Factor (B): " + B);
        System.out.println("Effort (person-months): " + effort);
        System.out.println("Estimated duration with 4 developers: " + monthsWith4Devs + " months");
        System.out.println("Estimated duration with 6 developers: " + monthsWith6Devs + " months");

        sc.close();
    }
}


`;

import java.util.*;

class Cyclomatic {
    public static void main(String args[]) {
        Scanner s = new Scanner(System.in);

        // Formula 1: Graph-based (E - N + 2)
        System.out.println("Enter the number of edges:");
        int e = s.nextInt();
        System.out.println("Enter the number of nodes:");
        int n = s.nextInt();

        int vgGraph = e - n + 2;
        System.out.println("Cyclomatic Complexity (Graph formula: E - N + 2) = " + vgGraph);

        // Formula 2: Decision-based (P + 1)
        System.out.println("Enter the number of decision points (predicate nodes):");
        int p = s.nextInt();

        int vgDecision = p + 1;
        System.out.println("Cyclomatic Complexity (Decision formula: P + 1) = " + vgDecision);
    }
}



`;

        /* =========================

        function escapeHTML(text) {

            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

        }


        /* =========================
           IMAGE SECTION
           ========================= */

            imageName,
            docxFileName = ""

                        class="btn"

                        download
                    >
                        Download Image
                    </a>


                    <a
                        class="btn"
                        href="${fileName}"
                        target="_blank"
                    >
                        Open Full Image
                    </a>

                    ${docxFileName ? `
                    <a
                        class="btn"
                        href="${docxFileName}"
                        target="_blank"
                    >
                        Open Word DOCX
                    </a>

                    <a
                        class="btn"
                        href="${docxFileName}"

                    >
                        Download Word DOCX
                    </a>
                    ` : ""}

                </div>


                <img
                    class="diagram"

                    onerror="imageError(this)"
                >


                <div

                    id="imageError-${fileName.replace(/[^a-zA-Z0-9]/g, '')}"

                    ❌ <b>Image could not be loaded.</b>

                    <br><br>

                    Make sure the file

                    <b>${fileName}</b>

                    exists in the same folder
                    as <b>se.html</b>.

                </div>

            `;

        }


        /* =========================
           IMAGE ERROR
           ========================= */

        function imageError(img) {

            img.style.display = "none";

            const errorBox =
                img.nextElementSibling;

            if (errorBox) {

                errorBox.style.display = "block";

            }

        }


        /* =========================

        function showProgram(
            number,
            button
        ) {

            document
                .querySelectorAll(".item")
                .forEach(function(item) {

                    item.classList.remove("active");

                });


            if (button) {

                button.classList.add("active");

            }


            const program =
                programs[number];


            document.getElementById(
                "content"
            ).innerHTML = `

                <div class="card">

                    <span class="tag">
                        PROGRAM ${number}
                    </span>

                    <h2>
                        ${program.title}
                    </h2>

                    ${program.body}

                </div>

            `;


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }


        /* =========================
           COPY JAVA CODE
           ========================= */

        function copyCode(code) {

            navigator
                .clipboard
                .writeText(code)
                .then(function() {

                    alert(
                        "Java code copied successfully!"
                    );

                })
                .catch(function() {

                    alert(
                        "Unable to copy code."
                    );

                });

        }


        /* =========================
           COPY IMAGE
           ========================= */

        async function copyImage(
            fileName
        ) {

            try {

                const response =
                    await fetch(fileName);


                if (!response.ok) {

                    throw new Error(
                        "Image not found"
                    );

                }


                const blob =
                    await response.blob();


                const imageBlob =
                    new Blob(
                        [blob],
                        {
                            type: blob.type
                        }
                    );


                await navigator.clipboard.write([

                    new ClipboardItem({

                        [blob.type]:
                            imageBlob

                    })

                ]);


                alert(
                    "Image copied successfully! You can paste it into Word."
                );

            }

            catch (error) {

                alert(
                    "Image copy is not available. Please use Download Image."
                );

            }

        }
